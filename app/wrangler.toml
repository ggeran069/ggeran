# Cloudflare WORKERS config for ggeran (@astrojs/cloudflare v14 deploys as a
# Worker with static assets — the legacy Pages `_worker.js` layout is gone).
#
# `astro build` generates the real deploy config at dist/server/wrangler.json
# (main = server entry, assets = dist/client, SESSION KV for Astro sessions)
# and writes the redirect .wrangler/deploy/config.json, so:
#     npx wrangler deploy          # from app/ — uses the generated config
# Secrets are NOT in this file — set them with `just secret <KEY>` (which runs
# `wrangler secret put`); local dev reads app/.dev.vars instead.
name = "ggeran"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ggeran-media"

[[d1_databases]]
binding = "DB"
database_name = "ggeran-db"
# Replace with the real id printed by: just d1-create
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "drizzle"
